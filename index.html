<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGMA-F / SUFER / ANTT · Logo Animado (ArcGIS Widget)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    /* Cores oficiais (Manual ANTT, p.26) */
    --green:   #007336;
    --blue:    #0057A8;
    --yellow:  #FAC61E;
    --ink:     #1A1F2A;
    --ink-2:   #3A4254;
    --ink-3:   #6B7488;
    --bg:      #F4F1E9;
    --paper:   #FFFFFF;
    --line:    #E2DCCC;
    --gillsans: "Gill Sans MT", "Gill Sans Nova", "Gill Sans", Cantarell, Lato, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; }

  body {
    font-family: var(--gillsans);
    color: var(--ink);
    background:
      radial-gradient(1100px 600px at 0% 0%, rgba(0,115,54,0.045), transparent 55%),
      radial-gradient(1000px 700px at 110% 110%, rgba(0,87,168,0.045), transparent 55%),
      radial-gradient(700px 500px at 95% -10%, rgba(250,198,30,0.04), transparent 55%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; min-height: 100vh;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  .stage {
    position: relative;
    width: min(820px, 100%);
    padding: 60px 56px 36px;
    background: var(--paper);
    border-radius: 22px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 0 0 1px rgba(26,31,42,0.06),
      0 30px 80px -40px rgba(26,31,42,0.22),
      0 8px 24px -16px rgba(26,31,42,0.10);
    overflow: hidden;
    transition: background-color 0.3s ease, box-shadow 0.3s ease;
  }

  /* Corner crops */
  .crop { position: absolute; width: 18px; height: 18px; opacity: 0.4; }
  .crop.tl { top: 14px; left: 14px;  border-top: 1.5px solid var(--blue);   border-left:  1.5px solid var(--blue); }
  .crop.tr { top: 14px; right: 14px; border-top: 1.5px solid var(--green);  border-right: 1.5px solid var(--green); }
  .crop.bl { bottom: 14px; left: 14px;  border-bottom: 1.5px solid var(--yellow); border-left:  1.5px solid var(--yellow); }
  .crop.br { bottom: 14px; right: 14px; border-bottom: 1.5px solid var(--ink-3);  border-right: 1.5px solid var(--ink-3); }

  .meta {
    position: absolute; top: 22px; right: 28px;
    font-family: var(--gillsans); font-size: 10px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3);
    display: flex; align-items: center; gap: 8px;
  }
  .meta::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 3px rgba(0,115,54,0.18);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 3px rgba(0,115,54,0.18); } 50% { box-shadow: 0 0 0 6px rgba(0,115,54,0.05); } }

  .mark {
    position: absolute; top: 22px; left: 28px;
    display: flex; align-items: center; gap: 10px;
    font-family: var(--gillsans); font-size: 9.5px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3);
  }
  .mark .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); display: inline-flex; }

  /* ========== SYMBOL ZONE ========== */
  .symbol-zone {
    position: relative;
    width: 160px;
    height: 144px;
    margin: 6px auto 0;
    /* Allow triangles to fly outside container during juggling */
    overflow: visible;
  }

  /* Each triangle is absolutely positioned at its HOME position; transform animates it from there */
  .tri {
    position: absolute;
    transform-origin: 50% 50%;
    will-change: transform;
  }
  .tri svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 2px 4px rgba(26,31,42,0.06)); }

  /* 10s cycle: 0-58% juggling, 58-65% converging, 65-85% holding (symbol), 85-92% dispersing, 92-100% juggling */
  .tri-blue-top   { left: 46.66px; top: 14.12px; width: 67.12px; height: 63.51px;
                    animation: dance-blue-top   10s cubic-bezier(.45,.05,.55,.95) infinite; }
  .tri-green-bl   { left: 10.45px; top: 76.05px; width: 71.20px; height: 61.39px;
                    animation: dance-green-bl   10s cubic-bezier(.45,.05,.55,.95) infinite; }
  .tri-blue-br    { left: 80.93px; top: 81.81px; width: 71.92px; height: 55.64px;
                    animation: dance-blue-br    10s cubic-bezier(.45,.05,.55,.95) infinite; }
  .tri-yellow-inv { left: 49.52px; top: 69.55px; width: 78.50px; height: 63.64px;
                    animation: dance-yellow-inv 10s cubic-bezier(.45,.05,.55,.95) infinite; }

  /* Arcs are designed so each triangle stays roughly above/around its home quadrant.
     All converge to translate(0,0) rotate(0) at 65% and hold until 85% — that's when the symbol is fully assembled. */
  @keyframes dance-blue-top {
    0%   { transform: translate(-22px, 18px)  rotate(-10deg); }
    14%  { transform: translate(-12px, -6px)  rotate(-2deg); }
    28%  { transform: translate(8px, -22px)   rotate(8deg); }
    42%  { transform: translate(22px, -10px)  rotate(14deg); }
    55%  { transform: translate(8px, -16px)   rotate(4deg); }
    65%  { transform: translate(0, 0)         rotate(0); }
    85%  { transform: translate(0, 0)         rotate(0); }
    92%  { transform: translate(-14px, 6px)   rotate(-6deg); }
    100% { transform: translate(-22px, 18px)  rotate(-10deg); }
  }
  @keyframes dance-green-bl {
    0%   { transform: translate(18px, -16px)  rotate(10deg); }
    14%  { transform: translate(2px, 4px)    rotate(4deg); }
    28%  { transform: translate(10px, 18px)   rotate(-4deg); }
    42%  { transform: translate(-14px, 12px)  rotate(-12deg); }
    55%  { transform: translate(-16px, -4px)  rotate(-4deg); }
    65%  { transform: translate(0, 0)         rotate(0); }
    85%  { transform: translate(0, 0)         rotate(0); }
    92%  { transform: translate(10px, -10px)  rotate(6deg); }
    100% { transform: translate(18px, -16px)  rotate(10deg); }
  }
  @keyframes dance-blue-br {
    0%   { transform: translate(-16px, -18px) rotate(-10deg); }
    14%  { transform: translate(2px, -20px)   rotate(-4deg); }
    28%  { transform: translate(20px, -8px)   rotate(6deg); }
    42%  { transform: translate(16px, 12px)   rotate(12deg); }
    55%  { transform: translate(-2px, 14px)   rotate(2deg); }
    65%  { transform: translate(0, 0)         rotate(0); }
    85%  { transform: translate(0, 0)         rotate(0); }
    92%  { transform: translate(-10px, -12px) rotate(-4deg); }
    100% { transform: translate(-16px, -18px) rotate(-10deg); }
  }
  @keyframes dance-yellow-inv {
    0%   { transform: translate(2px, 16px)    rotate(14deg); }
    14%  { transform: translate(-14px, 12px)  rotate(8deg); }
    28%  { transform: translate(-18px, -4px)  rotate(-6deg); }
    42%  { transform: translate(-2px, -18px)  rotate(-12deg); }
    55%  { transform: translate(14px, -10px)  rotate(-4deg); }
    65%  { transform: translate(0, 0)         rotate(0); }
    85%  { transform: translate(0, 0)         rotate(0); }
    92%  { transform: translate(6px, 12px)    rotate(8deg); }
    100% { transform: translate(2px, 16px)    rotate(14deg); }
  }

  /* ========== WORDMARK ========== */
  .word {
    position: relative;
    display: flex;
    justify-content: center;
    margin: 8px auto 0;
  }

  .word__inner {
    position: relative;
    display: inline-flex;
    align-items: center;
  }

  .sigma-brand {
    font-family: var(--gillsans);
    font-weight: 900;
    font-size: clamp(26px, 4.5vw, 46px);
    line-height: 1;
    z-index: 3;
    position: relative;
    letter-spacing: -0.01em;
    white-space: nowrap;
    display: inline-flex;
    gap: 6px;
    transform: translateY(15%);
  }
  .sigma-primary { color: var(--green); }
  .sigma-secondary { color: var(--blue); }

  /* ========== VEHICLE LANE ========== */
  .lane {
    position: absolute;
    inset: 0 -8px -8px -8px;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }

  .lane::before {
    content: ""; position: absolute;
    left: 4%; right: 4%; bottom: 4px;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(26,31,42,0.05) 8%, rgba(26,31,42,0.10) 50%, rgba(26,31,42,0.05) 92%, transparent 100%);
  }

  .veh {
    position: absolute; left: -120px;
    color: var(--ink-2); opacity: 0.55;
    will-change: transform;
  }
  .veh svg { display: block; }

  .veh.truck { bottom: 0%; animation: drive 8.5s linear infinite; animation-delay: -1.2s; }
  .veh.car   { bottom: 38%; animation: drive 6.2s linear infinite; animation-delay: -3.4s; opacity: 0.48; }
  .veh.train { bottom: 70%; animation: drive 11s linear infinite; animation-delay: -7s;   opacity: 0.42; }

  @keyframes drive {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(100vw + 280px)); }
  }

  /* ========== TAGLINE ========== */
  .tag {
    text-align: center; margin-top: 30px;
    font-family: var(--gillsans); font-size: 11px; font-weight: 700;
    letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink-3);
    display: flex; align-items: center; justify-content: center;
    gap: 14px; flex-wrap: wrap;
  }
  .tag .sep { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); opacity: 0.5; }
  .tag .accent { color: var(--green); }

  /* ==========================================================================
     ADAPTAÇÕES PARA O ARCGIS (TEMAS E LAYOUTS PARAMETRIZADOS)
     ========================================================================= */

  /* --------------------------------------------------------------------------
     A. TEMAS (Ativados via classes no elemento <html>)
     -------------------------------------------------------------------------- */

  /* 1. TEMA ESCURO (theme-dark) */
  html.theme-dark {
    --bg:      #11151D;
    --paper:   #1A1F2C;
    --ink:     #FFFFFF;
    --ink-2:   #E2DCCC;
    --ink-3:   #8C96A8;
    --line:    #2D3545;
    /* Ajuste de contraste sutil para fontes em modo escuro */
    --green:   #00A850;
    --blue:    #3B91FF;
  }
  html.theme-dark body {
    background:
      radial-gradient(1100px 600px at 0% 0%, rgba(255,255,255,0.015), transparent 55%),
      radial-gradient(1000px 700px at 110% 110%, rgba(0,87,168,0.03), transparent 55%),
      radial-gradient(700px 500px at 95% -10%, rgba(250,198,30,0.02), transparent 55%),
      var(--bg);
  }
  html.theme-dark .stage {
    box-shadow:
      0 1px 0 rgba(255,255,255,0.05) inset,
      0 0 0 1px rgba(255,255,255,0.05),
      0 30px 80px -40px rgba(0,0,0,0.6),
      0 8px 24px -16px rgba(0,0,0,0.4);
  }
  html.theme-dark .crop.tl { border-top-color: var(--blue); border-left-color: var(--blue); }
  html.theme-dark .crop.tr { border-top-color: var(--green); border-right-color: var(--green); }
  html.theme-dark .lane::before {
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.03) 8%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.03) 92%, transparent 100%);
  }

  /* 2. TEMA TRANSPARENTE (theme-transparent) */
  html.theme-transparent body {
    background: transparent !important;
  }
  html.theme-transparent .stage {
    background: transparent !important;
    box-shadow: none !important;
    border: none !important;
  }

  /* 3. SUB-TEMAS DE TEXTO (Para fundos transparentes) */
  html.text-light {
    --ink:     #FFFFFF;
    --ink-2:   #E2DCCC;
    --ink-3:   #A1AAB9;
    --green:   #00C25B;
    --blue:    #52A3FF;
  }
  html.text-light .mark .dot { background: #FFFFFF; }
  html.text-light .crop.br, html.text-light .crop.bl { border-color: rgba(255,255,255,0.3); }

  html.text-dark {
    --ink:     #1A1F2A;
    --ink-2:   #3A4254;
    --ink-3:   #6B7488;
    --green:   #007336;
    --blue:    #0057A8;
  }

  /* --------------------------------------------------------------------------
     B. LAYOUTS (Ativados via classes no elemento <html>)
     -------------------------------------------------------------------------- */

  /* 1. LAYOUT BANNER (Horizontal para cabeçalhos de Dashboards/StoryMaps) */
  html.layout-banner body {
    padding: 0;
    min-height: unset;
    height: 100vh;
    overflow: hidden;
  }
  html.layout-banner .stage {
    width: 100%;
    height: 100%;
    max-width: unset;
    padding: 0 24px;
    margin: 0;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 32px;
    background: transparent !important;
    box-shadow: none !important;
    border: none !important;
    border-radius: 0;
    overflow: hidden;
  }
  html.layout-banner .symbol-zone {
    margin: 0;
    flex-shrink: 0;
    will-change: transform;
  }
  html.layout-banner .word {
    margin: 0;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    will-change: transform;
  }
  html.layout-banner .word__inner {
    align-items: center;
  }
  html.layout-banner .sigma-brand {
    font-size: clamp(20px, 3.5vw, 38px);
    transform: none;
  }
  html.layout-banner .crop,
  html.layout-banner .mark,
  html.layout-banner .meta,
  html.layout-banner .lane,
  html.layout-banner .tag {
    display: none !important;
  }

  /* 2. LAYOUT MINIMAL (Vertical, sem bordas, padding ou fundos) */
  html.layout-minimal body {
    padding: 12px;
    min-height: unset;
    height: 100vh;
  }
  html.layout-minimal .stage {
    background: transparent !important;
    box-shadow: none !important;
    border: none !important;
    padding: 0 !important;
    width: 100% !important;
    max-width: 480px !important;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  html.layout-minimal .symbol-zone {
    margin: 0 auto;
  }
  html.layout-minimal .crop,
  html.layout-minimal .mark,
  html.layout-minimal .meta,
  html.layout-minimal .lane,
  html.layout-minimal .tag {
    display: none !important;
  }

  /* 3. LAYOUT SYMBOL (Apenas o logo animado) */
  html.layout-symbol body {
    padding: 0;
    min-height: unset;
    height: 100vh;
    overflow: hidden;
  }
  html.layout-symbol .stage {
    width: 100%;
    height: 100%;
    max-width: unset;
    padding: 0 !important;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent !important;
    box-shadow: none !important;
    border: none !important;
    border-radius: 0;
    overflow: hidden;
  }
  html.layout-symbol .symbol-zone {
    margin: 0;
    flex-shrink: 0;
    will-change: transform;
  }
  html.layout-symbol .crop,
  html.layout-symbol .mark,
  html.layout-symbol .meta,
  html.layout-symbol .word,
  html.layout-symbol .lane,
  html.layout-symbol .tag {
    display: none !important;
  }

  /* ========== AJUSTE DE RESPONSIVIDADE ORIGINAL (CARD) ========== */
  @media (max-width: 600px) {
    /* Só aplica no layout original 'card' */
    html.layout-card .stage { padding: 56px 22px 26px; }
    html.layout-card .meta { right: 18px; top: 18px; }
    html.layout-card .mark { left: 18px; top: 18px; font-size: 9px; gap: 8px; }

    html.layout-card .symbol-zone { width: 110px; height: 99px; margin-bottom: 18px; }
    html.layout-card .tri-blue-top   { left: 32.1px; top:  9.7px; width: 46.1px; height: 43.7px; }
    html.layout-card .tri-green-bl   { left:  7.2px; top: 52.3px; width: 49.0px; height: 42.2px; }
    html.layout-card .tri-blue-br    { left: 55.7px; top: 56.3px; width: 49.4px; height: 38.3px; }
    html.layout-card .tri-yellow-inv { left: 34.0px; top: 47.8px; width: 54.0px; height: 43.7px; }

    @keyframes dance-blue-top {
      0%   { transform: translate(-13px, 11px)  rotate(-10deg); }
      14%  { transform: translate(-7px, -3px)   rotate(-2deg); }
      28%  { transform: translate(5px, -13px)   rotate(8deg); }
      42%  { transform: translate(13px, -6px)   rotate(14deg); }
      55%  { transform: translate(5px, -10px)   rotate(4deg); }
      65%  { transform: translate(0, 0)         rotate(0); }
      85%  { transform: translate(0, 0)         rotate(0); }
      92%  { transform: translate(-8px, 3px)    rotate(-6deg); }
      100% { transform: translate(-13px, 11px)  rotate(-10deg); }
    }
    @keyframes dance-green-bl {
      0%   { transform: translate(11px, -10px)  rotate(10deg); }
      14%  { transform: translate(2px, 2px)    rotate(4deg); }
      28%  { transform: translate(6px, 11px)    rotate(-4deg); }
      42%  { transform: translate(-8px, 7px)    rotate(-12deg); }
      55%  { transform: translate(-10px, -2px)  rotate(-4deg); }
      65%  { transform: translate(0, 0)         rotate(0); }
      85%  { transform: translate(0, 0)         rotate(0); }
      92%  { transform: translate(6px, -6px)    rotate(6deg); }
      100% { transform: translate(11px, -10px)  rotate(10deg); }
    }
    @keyframes dance-blue-br {
      0%   { transform: translate(-10px, -11px) rotate(-10deg); }
      14%  { transform: translate(2px, -12px)   rotate(-4deg); }
      28%  { transform: translate(12px, -5px)   rotate(6deg); }
      42%  { transform: translate(10px, 7px)    rotate(12deg); }
      55%  { transform: translate(-2px, 8px)    rotate(2deg); }
      65%  { transform: translate(0, 0)         rotate(0); }
      85%  { transform: translate(0, 0)         rotate(0); }
      92%  { transform: translate(-6px, -7px)   rotate(-4deg); }
      100% { transform: translate(-10px, -11px) rotate(-10deg); }
    }
    @keyframes dance-yellow-inv {
      0%   { transform: translate(2px, 10px)    rotate(14deg); }
      14%  { transform: translate(-8px, 7px)    rotate(8deg); }
      28%  { transform: translate(-11px, -2px)  rotate(-6deg); }
      42%  { transform: translate(-2px, -11px)  rotate(-12deg); }
      55%  { transform: translate(8px, -6px)    rotate(-4deg); }
      65%  { transform: translate(0, 0)         rotate(0); }
      85%  { transform: translate(0, 0)         rotate(0); }
      92%  { transform: translate(3px, 7px)     rotate(8deg); }
      100% { transform: translate(2px, 10px)    rotate(14deg); }
    }

    html.layout-card .sigma-brand {
      font-size: clamp(18px, 5vw, 32px);
      transform: translateY(10%);
    }
    html.layout-card .tag {
      font-size: 9px; gap: 6px; letter-spacing: 0.16em;
      flex-direction: column; margin-top: 22px;
    }
    html.layout-card .tag .sep { display: none; }
  }

  @media (max-width: 400px) {
    html.layout-card .stage { padding: 50px 16px 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .tri-blue-top, .tri-green-bl, .tri-blue-br, .tri-yellow-inv,
    .veh, .meta::before { animation: none; }
  }
</style>
</head>
<body>

  <main class="stage" role="img" aria-label="Logo animado SIGMA-F / SUFER / ANTT — Agência Nacional de Transportes Terrestres">

    <span class="crop tl"></span><span class="crop tr"></span>
    <span class="crop bl"></span><span class="crop br"></span>

    <div class="mark" aria-hidden="true">
      <span class="dot"></span><span>Identidade ANTT</span>
    </div>
    <div class="meta">v · 1.2</div>

    <div class="symbol-zone" aria-hidden="true">
          <div class="tri tri-blue-top">
            <svg viewBox="328.08 604.47 26.01 24.61" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
              <path fill="#0057A8" d="M 341.640625 604.46875 L 328.082031 628.207031 C 328.257812 628.636719 328.59375 629.082031 329.035156 629.054688 L 354.09375 626.039062 Z M 341.640625 604.46875 "/>
            </svg>
          </div>
          <div class="tri tri-green-bl">
            <svg viewBox="314.05 628.47 27.59 23.79" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
              <path fill="#007336" d="M 327.90625 628.46875 L 314.046875 652.261719 L 341.640625 652.261719 Z M 327.90625 628.46875 "/>
            </svg>
          </div>
          <div class="tri tri-blue-br">
            <svg viewBox="341.36 630.70 27.87 21.56" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
              <path fill="#0057A8" d="M 356.785156 630.699219 L 369.234375 652.261719 L 341.96875 652.261719 C 341.714844 651.820312 341.355469 651.515625 341.699219 651 L 341.699219 650.992188 Z M 356.785156 630.699219 "/>
            </svg>
          </div>
          <div class="tri tri-yellow-inv">
            <svg viewBox="329.19 625.95 30.42 24.66" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
              <path fill="#FAC61E" d="M 341.335938 650.605469 C 341.378906 650.507812 341.425781 650.417969 341.484375 650.324219 L 341.492188 650.3125 L 359.609375 625.949219 L 329.527344 629.566406 L 329.519531 629.566406 C 329.40625 629.574219 329.292969 629.570312 329.1875 629.554688 Z M 341.335938 650.605469 "/>
            </svg>
          </div>
    </div>

    <div class="word">
      <div class="word__inner">

  <script>
    (function() {
      // 1. LER PARÂMETROS DA URL
      const params = new URLSearchParams(window.location.search);
      
      // Layout
      let layout = params.get('layout') || 'card';
      if (layout === 'logo' || layout === 'icon') {
        layout = 'symbol';
      }
      document.documentElement.classList.add('layout-' + layout);
      
      // Tema de Fundo
      const theme = params.get('theme') || 'light';
      document.documentElement.classList.add('theme-' + theme);
      
      // Tema de Texto (especialmente útil para theme-transparent)
      const text = params.get('text');
      if (text) {
        document.documentElement.classList.add('text-' + text);
      } else if (theme === 'dark') {
        document.documentElement.classList.add('text-light');
      } else if (theme === 'light') {
        document.documentElement.classList.add('text-dark');
      }

      // 2. CORRIGIR AUTO-SCALING COM BASE NO ESPAÇO DISPONÍVEL (DASHBOARDS/IFRAMES)
      function adjustScale() {
        const currentLayout = document.documentElement.className.match(/layout-(\w+)/)?.[1] || 'card';
        const zone = document.querySelector('.symbol-zone');
        const word = document.querySelector('.word');
        
        if (!zone) return;

        // Resetar estilos de transformação antes de recalcular
        zone.style.transform = '';
        zone.style.transformOrigin = '';
        if (word) {
          word.style.transform = '';
          word.style.transformOrigin = '';
        }

        const parentWidth = window.innerWidth;
        const parentHeight = window.innerHeight;

        if (currentLayout === 'symbol') {
          // Dimensões originais do símbolo: 160px largura por 144px altura
          const targetW = 160;
          const targetH = 144;
          
          // Calcula a proporção baseada nas dimensões do iframe/container
          const scaleX = (parentWidth - 16) / targetW;
          const scaleY = (parentHeight - 16) / targetH;
          
          // Escolhe o menor multiplicador para caber perfeitamente sem cortar
          const scale = Math.min(scaleX, scaleY);
          
          // Aplica escala
          zone.style.transform = `scale(${scale})`;
          zone.style.transformOrigin = 'center center';
          
        } else if (currentLayout === 'banner') {
          // Layout horizontal. Se a altura do cabeçalho for muito pequena, escalona os componentes
          const targetH = 100; // Altura ideal para exibição em 1x no banner
          const scale = Math.min(parentHeight / targetH, 1);
          
          if (scale < 1 && scale > 0.1) {
            zone.style.transform = `scale(${0.65 * scale})`;
            zone.style.transformOrigin = 'center center';
            if (word) {
              word.style.transform = `scale(${0.85 * scale})`;
              word.style.transformOrigin = 'left center';
            }
          } else {
            zone.style.transform = 'scale(0.65)';
            zone.style.transformOrigin = 'center center';
            if (word) {
              word.style.transform = 'scale(0.85)';
              word.style.transformOrigin = 'left center';
            }
          }
        }
      }

      // Executa no carregamento e nos eventos de redimensionamento
      window.addEventListener('resize', adjustScale);
      
      // Usar DOMContentLoaded e também o load geral para garantir posicionamentos prontos
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', adjustScale);
      } else {
        adjustScale();
      }
      window.addEventListener('load', adjustScale);
      
    })();
  </script>
